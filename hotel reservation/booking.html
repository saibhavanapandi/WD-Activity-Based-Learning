
<!DOCTYPE html>
<html>
<head>
    <title>Hotel Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Room Reservation</h1>
    <p>Book Your Stay With Us</p>
</header>

<nav>
    <a href="index.html" target="_blank">Home</a>
    <a href="rooms.html" target="_blank">Rooms</a>
    <a href="booking.html" target="_blank">Reservation</a>
</nav>

<section class="booking">
    <h2>Hotel Booking Form</h2>

    <form action="#" method="post">

        <label>Guest Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number" required>

        <label>Check-in Date</label>
        <input type="date" required>

        <label>Check-out Date</label>
        <input type="date" required>

        <label>Number of Guests</label>
        <input type="number" min="1" placeholder="Enter guests" required>

        <label>Select Room Type</label>
        <select required>
            <option value="">Choose Room</option>
            <option>Deluxe Room - ₹2500</option>
            <option>Suite Room - ₹4000</option>
            <option>Family Room - ₹5000</option>
        </select>

        <label>Special Requests</label>
        <textarea rows="4" placeholder="Enter your requests"></textarea>

        <button type="submit">Confirm Reservation</button>

    </form>
</section>

<footer>
    <p>© 2026 Grand Palace Hotel</p>
</footer>

</body>
</html>
