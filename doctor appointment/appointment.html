<!DOCTYPE html>
<html>
<head>
    <title>Book Doctor Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>CarePlus Hospital</h1>
    <p>Patient Appointment Registration</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="index.html#doctors">Doctors</a>
    <a href="appointment.html">Appointment</a>
</nav>

<div class="form-container">

    <h2>Book Your Appointment</h2>

    <form action="success.html" method="get">

        <label>Patient Name:</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Email Address:</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter phone number" required>

        <label>Age:</label>
        <input type="number" min="1" max="120" placeholder="Enter your age" required>

        <label>Select Doctor:</label>
        <select required>
            <option value="">Choose Doctor</option>
            <option>Dr. Rahul Sharma - Cardiologist</option>
            <option>Dr. Priya Reddy - Dermatologist</option>
            <option>Dr. Arjun Kumar - Neurologist</option>
        </select>

        <label>Appointment Date:</label>
        <input type="date" required>

        <label>Available Time Slot:</label>
        <select required>
            <option value="">Select Time</option>
            <option>9:00 AM - 10:00 AM</option>
            <option>10:00 AM - 11:00 AM</option>
            <option>11:00 AM - 12:00 PM</option>
            <option>4:00 PM - 5:00 PM</option>
            <option>5:00 PM - 6:00 PM</option>
        </select>

        <label>Gender:</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Describe Your Problem:</label>
        <textarea placeholder="Enter your health problem"></textarea>

        <button type="submit">Confirm Appointment</button>

    </form>

    <a href="index.html" class="back">Back to Home</a>

</div>

<footer>
    <p>© 2026 CarePlus Hospital</p>
</footer>

</body>
</html>
